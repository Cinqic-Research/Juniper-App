[package]
name = "juniper"
version = "0.4.0-alpha.1"
description = "Juniper local-first AI environment"
authors = ["Cinqic"]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[lib]
name = "juniper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
base64 = "0.22.1"
cap-std = "3.4.4"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
futures-util = "0.3.31"
hmac = "0.12.1"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
similar = "2.7.0"
sysinfo = "0.37.0"
tauri = { version = "2.8.1", features = ["test"] }
tauri-plugin-dialog = "2.3.2"
juniper-local-runtime = { path = "plugins/juniper-local" }
thiserror = "2.0.16"
url = "2.5.7"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.175"

# Job objects end the local runtime and MCP servers with Juniper on Windows
# (`child.rs`), and the NTFS change time backs the model verification cache
# (`managed_models.rs`); the crate is already in the tree through Tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "4.1.5", default-features = true, features = ["v1"] }

# Juniper 1's canonical tokenizer (j1tok), loaded host-side by the desktop token-ID
# backend; Android keeps Juniper 1 blocked. Pinned to the release the Python reference
# uses, with `onig`, the regex engine that release's Python wheel uses.
[target.'cfg(not(target_os = "android"))'.dependencies]
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }

[dev-dependencies]
regex = "1.13.1"
