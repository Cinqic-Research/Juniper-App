[package]
name = "juniper-local-runtime"
version = "0.4.0-alpha.1"
description = "Juniper's in-process mobile llama.cpp runtime bridge"
authors = ["Cinqic"]
edition = "2024"
license = "Apache-2.0"
links = "juniper-local-runtime"

[lib]
name = "juniper_local_runtime"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tauri = { version = "2.8.1", features = ["test"] }

[package.metadata.tauri-plugin]
android-src = "android"
