name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag to build
        required: true
        type: string
      publish:
        description: Publish after every build and verification gate passes
        required: true
        default: false
        type: boolean
      confirm_commit:
        description: Exact tagged commit SHA required when publish is enabled
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.19.0'

jobs:
  contract:
    name: Immutable release contract
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.contract.outputs.tag }}
      version: ${{ steps.contract.outputs.version }}
      commit: ${{ steps.contract.outputs.commit }}
      publish: ${{ steps.contract.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify tag, commit, and version agreement
        id: contract
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          CONFIRM_COMMIT: ${{ inputs.confirm_commit }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$RELEASE_TAG"
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          commit=$(git rev-list -n 1 "$RELEASE_TAG")
          test "$commit" = "$(git rev-parse HEAD)"
          test "$(git tag --points-at HEAD | grep -Fx "$RELEASE_TAG" | wc -l)" -eq 1
          RELEASE_TAG="$RELEASE_TAG" node scripts/check-version.mjs
          node scripts/check-project-license.mjs
          node scripts/check-runtime-contract.mjs
          version=${RELEASE_TAG#v}
          publish=false
          if test "$GITHUB_EVENT_NAME" = push || test "$REQUESTED_PUBLISH" = true; then
            publish=true
            test -n "$CONFIRM_COMMIT" || test "$GITHUB_EVENT_NAME" = push
            test -z "$CONFIRM_COMMIT" || test "$CONFIRM_COMMIT" = "$commit"
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
              exit 1
            fi
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x86_64 build and install smoke
    needs: contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.contract.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Install Linux prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
          libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb cmake
          x11-utils x11-apps desktop-file-utils fuse3 python3 python3-xlib
          libegl1 libgl1 libgles2 libgbm1 libegl-mesa0 libgl1-mesa-dri libfontconfig1
          libharfbuzz0b libfribidi0 libx11-xcb1
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - name: Build pinned Juniper local runtime
        run: scripts/build-llama-runtime.sh
      - name: Require the native runtime resource before bundling
        run: test -x src-tauri/runtime/llama-server
      - name: Build DEB and AppImage from locked source
        run: pnpm tauri build --bundles deb,appimage -- --locked
      - name: Collect exactly one artifact of each type
        env:
          VERSION: ${{ needs.contract.outputs.version }}
        run: |
          mapfile -d '' debs < <(find src-tauri/target/release/bundle -type f -name '*.deb' -print0)
          mapfile -d '' appimages < <(find src-tauri/target/release/bundle -type f -name '*.AppImage' -print0)
          test "${#debs[@]}" -eq 1
          test "${#appimages[@]}" -eq 1
          mkdir release-artifacts
          cp "${debs[0]}" "release-artifacts/Juniper-$VERSION-linux-x86_64.deb"
          cp "${appimages[0]}" "release-artifacts/Juniper-$VERSION-linux-x86_64.AppImage"
      # Positive-readiness smoke: normal AppImage (FUSE), extract-and-run
      # fallback, and installed DEB must each render a ready Juniper window.
      - name: Install, launch, and uninstall Linux bundles
        env:
          VERSION: ${{ needs.contract.outputs.version }}
        run: >-
          xvfb-run -a -s '-screen 0 1440x900x24'
          scripts/verify-linux-bundles.sh release-artifacts "$VERSION" ubuntu-22.04-x11
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: juniper-linux-x86_64
          path: release-artifacts
          if-no-files-found: error

  linux-noble:
    name: Linux artifact launch smoke on Ubuntu 24.04
    needs: [contract, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.contract.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: juniper-linux-x86_64
          path: noble-artifacts
      # A bare runner lacks the graphics and font libraries every desktop has and
      # AppImages deliberately take from the host (EGL/GL/GBM, Mesa, fontconfig).
      - name: Install launch-smoke prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          xvfb x11-utils x11-apps desktop-file-utils fuse3 file python3 python3-xlib
          libegl1 libgl1 libgles2 libgbm1 libegl-mesa0 libgl1-mesa-dri libfontconfig1
          libharfbuzz0b libfribidi0 libx11-xcb1
      - name: Install, launch, and uninstall the built Linux bundles
        env:
          VERSION: ${{ needs.contract.outputs.version }}
        run: >-
          xvfb-run -a -s '-screen 0 1440x900x24'
          scripts/verify-linux-bundles.sh noble-artifacts "$VERSION" ubuntu-24.04-x11
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-smoke-evidence-ubuntu-24.04
          path: noble-artifacts/linux-smoke-ubuntu-24.04-x11
          if-no-files-found: error

  windows:
    name: Windows x86_64 MSI install smoke
    needs: contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.contract.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - name: Build pinned Juniper local runtime
        shell: bash
        run: scripts/build-llama-runtime.sh
      - name: Require the native runtime resource before bundling
        shell: pwsh
        run: if (-not (Test-Path -LiteralPath 'src-tauri/runtime/llama-server.exe' -PathType Leaf)) { throw 'llama-server.exe was not built.' }
      # Native unit tests are excluded here only: the Tauri mock runtime fails
      # to load on the Windows runner, aborting the test binary at startup with
      # STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139) before any test executes. They
      # run on Linux in validation.yml. Every compile-level check still runs
      # here, including clippy -D warnings, and the shared MSI smoke below
      # checks the graphical subsystem and rendered window on Windows.
      - run: pnpm validate:no-native-tests
      - name: Build MSI from locked source
        run: pnpm tauri build --bundles msi -- --locked
      - name: Collect exactly one MSI
        shell: pwsh
        env:
          VERSION: ${{ needs.contract.outputs.version }}
        run: |
          $msis = @(Get-ChildItem -Recurse src-tauri/target/release/bundle -Filter *.msi)
          if ($msis.Count -ne 1) { throw "Expected one MSI, found $($msis.Count)." }
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Copy-Item $msis[0].FullName "release-artifacts/Juniper-$env:VERSION-windows-x86_64.msi"
      - name: Inspect GUI subsystem, install, render, and uninstall MSI
        shell: pwsh
        env:
          VERSION: ${{ needs.contract.outputs.version }}
        run: >-
          ./scripts/verify-windows-msi.ps1
          -MsiPath "release-artifacts/Juniper-$env:VERSION-windows-x86_64.msi"
          -ExpectedAppVersion "$env:VERSION"
          -ExpectedMsiVersion ((Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).bundle.windows.wix.version)
          -EvidencePath 'release-artifacts/SIGNING-windows.txt'
          -PackageEvidencePath 'release-artifacts/PACKAGE-windows.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: juniper-windows-x86_64
          path: release-artifacts
          if-no-files-found: error

  android:
    name: Signed Android universal APK smoke
    needs: contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.contract.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        # The action's default also requests the removed legacy 'tools' package,
        # which now fails sdkmanager with "Failed to find package 'tools'".
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6' 'emulator' 'system-images;android-30;default;x86_64'
      - name: Install Android package audit tools
        run: sudo apt-get update && sudo apt-get install -y unzip zip binutils
      - name: Put Android build-tools on PATH
        run: echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Initialize Android from clean source
        run: pnpm tauri android init --ci
      - name: Install official Juniper launcher branding
        run: node scripts/install-android-branding.mjs
      - name: Verify generated Android launcher branding
        run: node scripts/verify-android-branding.mjs project
      - name: Provision ephemeral Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ needs.contract.outputs.tag }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/juniper-release.jks"
          chmod 600 "$RUNNER_TEMP/juniper-release.jks"
          {
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/juniper-release.jks"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
          chmod 600 src-tauri/gen/android/keystore.properties
          node scripts/configure-android-signing.mjs
      - name: Build signed release APK from locked source
        run: pnpm tauri android build --apk --ci --target aarch64 x86_64 -- --locked
      - name: Build Android credential-vault instrumentation
        working-directory: src-tauri/gen/android
        run: >-
          bash ./gradlew :juniper-local-runtime:assembleDebugAndroidTest
          -PjuniperNativeAbis=x86_64 --no-daemon --stacktrace
      - name: Grant the ephemeral runner access to KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Collect and verify exactly one signed APK
        env:
          VERSION: ${{ needs.contract.outputs.version }}
        run: |
          mapfile -d '' apks < <(find src-tauri/gen/android -type f -name '*release*.apk' -print0)
          test "${#apks[@]}" -eq 1
          mkdir release-artifacts
          cp "${apks[0]}" "release-artifacts/Juniper-$VERSION-android-universal.apk"
          bash scripts/verify-android-apk.sh \
            "release-artifacts/Juniper-$VERSION-android-universal.apk" \
            release-artifacts/android-apk-audit
          node scripts/verify-android-branding.mjs apk \
            "release-artifacts/Juniper-$VERSION-android-universal.apk" \
            --evidence release-artifacts/android-apk-audit/launcher-branding.json
          symbols_dir=$(find src-tauri/gen/android/app/build/intermediates/merged_native_libs \
            -type d -path '*/out/lib' | sort | tail -n 1)
          test -n "$symbols_dir" && test -d "$symbols_dir"
          bash scripts/package-android-symbols.sh "$symbols_dir" \
            "release-artifacts/Juniper-$VERSION-android-native-symbols.zip"
          apksigner verify --verbose --print-certs "release-artifacts/Juniper-$VERSION-android-universal.apk" | tee release-artifacts/SIGNING-android.txt
          aapt dump badging "release-artifacts/Juniper-$VERSION-android-universal.apk" | tee release-artifacts/PACKAGE-android.txt
          grep -F "package: name='com.cinqic.juniper' versionCode='$(jq -r '.bundle.android.versionCode' src-tauri/tauri.conf.json)' versionName='$VERSION'" release-artifacts/PACKAGE-android.txt
      # The pinned emulator action's internal settings/input setup can fail with
      # Broken pipe after it reports the emulator booted. Start one explicitly so
      # only bounded ADB probes and the repository lifecycle helper run here.
      - name: Install, launch, lifecycle smoke, and uninstall APK
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          JUNIPER_CREDENTIAL_TEST_APK: ${{ github.workspace }}/src-tauri/plugins/juniper-local/android/build/outputs/apk/androidTest/debug/juniper-local-runtime-debug-androidTest.apk
        run: >-
          timeout --foreground 30m bash scripts/run-android-emulator-smoke.sh
          "release-artifacts/Juniper-$VERSION-android-universal.apk"
          com.cinqic.juniper release-artifacts/android-lifecycle
      - name: Remove signing material
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/juniper-release.jks" 2>/dev/null || true
          shred -u src-tauri/gen/android/keystore.properties 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: juniper-android-universal
          path: release-artifacts
          if-no-files-found: warn

  verify:
    name: Downloaded artifact verification and provenance
    needs: [contract, linux, linux-noble, windows, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.contract.outputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: juniper-*
          path: release-artifacts
          merge-multiple: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        # The action's default also requests the removed legacy 'tools' package,
        # which now fails sdkmanager with "Failed to find package 'tools'".
        with:
          packages: platform-tools
      - name: Install Android verification tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Put Android build-tools on PATH
        run: echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Require the complete artifact matrix and recompute hashes
        env:
          VERSION: ${{ needs.contract.outputs.version }}
        run: |
          test -f "release-artifacts/Juniper-$VERSION-linux-x86_64.deb"
          test -f "release-artifacts/Juniper-$VERSION-linux-x86_64.AppImage"
          test -f "release-artifacts/Juniper-$VERSION-windows-x86_64.msi"
          test -f "release-artifacts/Juniper-$VERSION-android-universal.apk"
          test -f "release-artifacts/Juniper-$VERSION-android-native-symbols.zip"
          test -f release-artifacts/SIGNING-windows.txt
          test -f release-artifacts/SIGNING-android.txt
          test -f release-artifacts/PACKAGE-linux.txt
          test -f release-artifacts/PACKAGE-windows.txt
          test -f release-artifacts/PACKAGE-android.txt
          test "$(find release-artifacts -maxdepth 1 -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.apk' \) | wc -l)" -eq 4
          cp LICENSE THIRD_PARTY_NOTICES.md release-artifacts/
          (cd release-artifacts && sha256sum Juniper-* > SHA256SUMS.txt)
          (cd release-artifacts && sha256sum --check SHA256SUMS.txt)
          apksigner verify --verbose --print-certs "release-artifacts/Juniper-$VERSION-android-universal.apk"
          dpkg-deb --field "release-artifacts/Juniper-$VERSION-linux-x86_64.deb" Version | grep -Fx "$VERSION"
          file release-artifacts/Juniper-*
      - name: Generate resolved release provenance
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          TAG: ${{ needs.contract.outputs.tag }}
          COMMIT: ${{ needs.contract.outputs.commit }}
        run: |
          jq -Rn \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg commit "$COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg release_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --argjson artifacts "$(jq -Rn '[inputs | capture("^(?<sha256>[0-9a-f]{64})  (?<name>.+)$")]' < release-artifacts/SHA256SUMS.txt)" \
            '{format:"juniper-release-provenance-v1", version:$version, tag:$tag, commit:$commit, workflowRunId:$run_id, workflowRunUrl:$run_url, releaseUrl:$release_url, prerelease:true, projectLicense:"Apache-2.0", windowsSigning:"see SIGNING-windows.txt", androidSigning:"see SIGNING-android.txt", androidQualification:"Beta; physical ARM64 inference unverified", deviceLink:"preview policy only; transport disabled", artifacts:$artifacts}' \
            > release-artifacts/RELEASE-PROVENANCE.json
          jq -e --arg version "$VERSION" --arg tag "$TAG" --arg commit "$COMMIT" \
            '.version == $version and .tag == $tag and .commit == $commit and (.artifacts | length) == 5' \
            release-artifacts/RELEASE-PROVENANCE.json
      - name: Attest executable release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/Juniper-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: juniper-verified-release
          path: release-artifacts
          if-no-files-found: error

  publish:
    name: Atomic GitHub prerelease publication
    if: needs.contract.outputs.publish == 'true'
    needs: [contract, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: juniper-verified-release
          path: release-artifacts
      - name: Generate release notes from verified evidence
        env:
          VERSION: ${{ needs.contract.outputs.version }}
          TAG: ${{ needs.contract.outputs.tag }}
          COMMIT: ${{ needs.contract.outputs.commit }}
        run: |
          set -o pipefail
          # Each artifact becomes a direct download link. `find -printf` is
          # deliberately not piped into `sort` without pipefail: a failure there
          # would otherwise be masked and publish an empty Downloads section.
          downloads=$(
            find release-artifacts -maxdepth 1 -type f -name 'Juniper-*' -printf '%f\n' \
              | sort \
              | while IFS= read -r file; do
                  printf -- '- [%s](https://github.com/%s/releases/download/%s/%s)\n' \
                    "$file" "$GITHUB_REPOSITORY" "$TAG" "$file"
                done
          )
          test -n "$downloads"
          {
            echo "# Juniper $VERSION"
            echo
            echo "Prerelease built from immutable tag \`$TAG\` at commit \`$COMMIT\`."
            echo
            echo '## Downloads'
            echo
            echo "$downloads"
            echo
            echo '## Verification'
            echo
            echo '- SHA-256 values are in `SHA256SUMS.txt`.'
            echo '- Android certificate details are in `SIGNING-android.txt`.'
            echo '- Windows Authenticode status is in `SIGNING-windows.txt`; no signature is implied unless it says `Valid`.'
            echo '- GitHub artifact attestations link each executable artifact to this workflow and commit.'
            echo
            echo '## Runtime notes'
            echo
            echo '- Models downloads verified GGUF weights on demand; the desktop bundle owns its loopback llama.cpp runtime and does not require Ollama.'
            echo '- Desktop credentials use the operating-system credential store; Android credentials use Android Keystore-backed AES-GCM storage.'
            echo '- Android loopback addresses refer to the phone itself; use an explicit LAN endpoint to reach a computer.'
            echo '- Android llama.cpp remains Beta because physical ARM64 inference qualification is not yet recorded.'
            echo '- Device Link is a non-networked policy preview. Pairing, discovery, peer connections, remote control, and Juniper Network transport are disabled.'
            echo '- Ollama, OpenAI-compatible, and llama.cpp-compatible providers remain optional. MCP client calls, iOS, and macOS are not included.'
            echo
            echo 'Source: https://github.com/Cinqic-Research/Juniper-App'
            echo 'License: Apache-2.0'
          } > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.contract.outputs.tag }}
          name: Juniper ${{ needs.contract.outputs.version }}
          prerelease: true
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-artifacts/Juniper-*
            release-artifacts/SHA256SUMS.txt
            release-artifacts/SIGNING-*.txt
            release-artifacts/PACKAGE-*.txt
            release-artifacts/RELEASE-PROVENANCE.json
            release-artifacts/LICENSE
            release-artifacts/THIRD_PARTY_NOTICES.md
      # A publication step can create the release and then fail part way
      # through its uploads: 0.3.0-rc.33 was published without its MSI, its DEB,
      # and RELEASE-PROVENANCE.json after the action reported
      # "Error creating asset temp dir". The job failed, but the release stayed
      # public and incomplete. Re-upload whatever is missing from the same
      # verified bundle, then fail if the published release still does not carry
      # every artifact.
      - name: Require every verified artifact to be published
        env:
          TAG: ${{ needs.contract.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=$(find release-artifacts -maxdepth 1 -type f -printf '%f\n' | sort)
          test -n "$expected"
          for attempt in 1 2 3; do
            published=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | sort)
            missing=$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$published"))
            if test -z "$missing"; then
              echo "All $(printf '%s\n' "$expected" | wc -l) verified artifacts are published."
              exit 0
            fi
            echo "Attempt $attempt: missing from the release:" >&2
            printf '%s\n' "$missing" >&2
            test "$attempt" -lt 3 || break
            # Upload only what is absent; an existing asset is never replaced.
            printf '%s\n' "$missing" \
              | sed 's|^|release-artifacts/|' \
              | xargs -r gh release upload "$TAG" --repo "$GITHUB_REPOSITORY"
          done
          echo "The published release is incomplete." >&2
          exit 1
