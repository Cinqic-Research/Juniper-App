name: validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same ref so duplicate validation runs
# do not consume runners while an earlier head is still being checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.19.0'

jobs:
  validate:
    name: Frontend, native, schemas, and audits
    runs-on: ubuntu-22.04
    # rustsec/audit-check publishes its result as a check run. Without
    # checks: write it fails with "Resource not accessible by integration"
    # after the audit itself has already succeeded. Scoped to this job so
    # the workflow default stays contents: read.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Install Tauri Linux dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
          libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Run native contract tests
        run: bash scripts/run-native-contract-tests.sh
      - run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high
      - run: pnpm validate
      - name: Production frontend build
        run: pnpm build
      - name: Install Linux launch-probe tools
        run: >-
          sudo apt-get install -y xvfb x11-utils x11-apps python3-gi python3-gi-cairo gir1.2-gtk-3.0
      - name: Prove the release publication guard rejects an incomplete release
        run: bash scripts/test-release-publication-guard.sh
      - name: Prove the Linux launch probe rejects non-usable launches
        run: xvfb-run -a -s '-screen 0 1440x900x24' scripts/test-linux-launch-probe.sh linux-probe-selftest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-probe-selftest-evidence
          path: linux-probe-selftest
          if-no-files-found: error
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
      - name: Install checksum-pinned Gitleaks CLI
        run: |
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}" \
            --output "$RUNNER_TEMP/${archive}"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/${archive}" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/${archive}" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan repository history for secrets
        run: >-
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all

  android-clean-build:
    name: Android clean debug compile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        # The action's default also requests the removed legacy 'tools' package,
        # which now fails sdkmanager with "Failed to find package 'tools'".
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: >-
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          'ndk;29.0.13113456' 'cmake;3.31.6' 'emulator'
          'system-images;android-30;default;x86_64'
      - name: Install Android package audit tools
        run: sudo apt-get update && sudo apt-get install -y unzip zip binutils
      - run: pnpm install --frozen-lockfile
      - name: Initialize Android from a clean checkout
        run: pnpm tauri android init --ci
      - name: Install official Juniper launcher branding
        run: node scripts/install-android-branding.mjs
      - name: Verify generated Android launcher branding
        run: node scripts/verify-android-branding.mjs project
      - name: Compile debug APK without signing material
        run: pnpm tauri android build --debug --apk --ci --target aarch64 x86_64
      - name: Require exactly one debug APK
        run: |
          mapfile -d '' apks < <(find src-tauri/gen/android -type f -name '*debug*.apk' -print0)
          test "${#apks[@]}" -eq 1
          bash scripts/verify-android-apk.sh "${apks[0]}" android-apk-audit
          node scripts/verify-android-branding.mjs apk "${apks[0]}" \
            --evidence android-apk-audit/launcher-branding.json
      - name: Build Android credential-vault instrumentation
        working-directory: src-tauri/gen/android
        run: >-
          bash ./gradlew :juniper-local-runtime:assembleDebugAndroidTest
          -PjuniperNativeAbis=x86_64 --no-daemon --stacktrace
      - name: Grant the ephemeral runner access to KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Run credential instrumentation and lifecycle smoke
        env:
          JUNIPER_CREDENTIAL_TEST_APK: ${{ github.workspace }}/src-tauri/plugins/juniper-local/android/build/outputs/apk/androidTest/debug/juniper-local-runtime-debug-androidTest.apk
        run: |
          mapfile -d '' apks < <(find src-tauri/gen/android -type f -name '*debug*.apk' -print0)
          test "${#apks[@]}" -eq 1
          timeout --foreground 30m bash scripts/run-android-emulator-smoke.sh \
            "${apks[0]}" com.cinqic.juniper android-runtime-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-validation-evidence
          path: |
            android-apk-audit
            android-runtime-evidence
          if-no-files-found: error

  linux-bundles:
    name: Linux bundle build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
      - name: Install Linux build prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
          libssl-dev libayatana-appindicator3-dev librsvg2-dev cmake
      - run: pnpm install --frozen-lockfile
      - name: Build pinned Juniper local runtime
        run: scripts/build-llama-runtime.sh
      - name: Build DEB and AppImage from locked source
        run: pnpm tauri build --bundles deb,appimage -- --locked
      - name: Collect exactly one artifact of each type
        run: |
          version=$(node -p "require('./package.json').version")
          mapfile -d '' debs < <(find src-tauri/target/release/bundle -type f -name '*.deb' -print0)
          mapfile -d '' appimages < <(find src-tauri/target/release/bundle -type f -name '*.AppImage' -print0)
          test "${#debs[@]}" -eq 1
          test "${#appimages[@]}" -eq 1
          mkdir linux-artifacts
          cp "${debs[0]}" "linux-artifacts/Juniper-$version-linux-x86_64.deb"
          cp "${appimages[0]}" "linux-artifacts/Juniper-$version-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-bundles-unreleased
          path: linux-artifacts
          if-no-files-found: error
          retention-days: 7

  linux-bundle-smoke:
    name: Linux bundle launch smoke (${{ matrix.runner }}, X11/Xvfb)
    needs: linux-bundles
    strategy:
      fail-fast: false
      matrix:
        # 22.04 is the build baseline; 24.04 consumes the same artifacts on a
        # newer WebKitGTK, GTK, and t64 library stack.
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-bundles-unreleased
          path: linux-artifacts
      # A bare runner lacks the graphics and font libraries every desktop has and
      # AppImages deliberately take from the host (EGL/GL/GBM, Mesa, fontconfig).
      - name: Install launch-smoke prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          xvfb x11-utils x11-apps desktop-file-utils fuse3 file python3 python3-xlib
          libegl1 libgl1 libgles2 libgbm1 libegl-mesa0 libgl1-mesa-dri libfontconfig1
          libharfbuzz0b libfribidi0 libx11-xcb1
      - name: Install, launch, and uninstall Linux bundles
        run: >-
          xvfb-run -a -s '-screen 0 1440x900x24'
          scripts/verify-linux-bundles.sh linux-artifacts
          "$(node -p "require('./package.json').version")" ${{ matrix.runner }}-x11
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-smoke-evidence-${{ matrix.runner }}
          path: linux-artifacts/linux-smoke-*
          if-no-files-found: error

  # Mirrors the release workflow's Windows job so the MSI build, install,
  # graphical PE and rendered-window launch, and uninstall are proven before a tag is pushed rather
  # than only after it, when a failure costs an immutable release candidate.
  windows-msi:
    name: Windows MSI graphical install, render, and uninstall smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - name: Build pinned Juniper local runtime
        shell: bash
        run: scripts/build-llama-runtime.sh
      - name: Require the native runtime resource before bundling
        shell: pwsh
        run: if (-not (Test-Path -LiteralPath 'src-tauri/runtime/llama-server.exe' -PathType Leaf)) { throw 'llama-server.exe was not built.' }
      # Native unit tests are excluded on Windows only; see release.yml.
      - run: pnpm validate:no-native-tests
      - name: Re-test Windows native unit test loader (diagnostic)
        continue-on-error: true
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build MSI from locked source
        run: pnpm tauri build --bundles msi -- --locked
      - name: Collect exactly one MSI
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $msis = @(Get-ChildItem -Recurse src-tauri/target/release/bundle -Filter *.msi)
          if ($msis.Count -ne 1) { throw "Expected one MSI, found $($msis.Count)." }
          New-Item -ItemType Directory -Force windows-artifacts | Out-Null
          Copy-Item $msis[0].FullName "windows-artifacts/Juniper-$version-windows-x86_64.msi"
      - name: Inspect GUI subsystem, install, render, and uninstall MSI
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./scripts/verify-windows-msi.ps1 `
            -MsiPath "windows-artifacts/Juniper-$version-windows-x86_64.msi" `
            -ExpectedAppVersion $version `
            -ExpectedMsiVersion ((Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).bundle.windows.wix.version) `
            -EvidencePath 'windows-artifacts/SIGNING-windows.txt' `
            -PackageEvidencePath 'windows-artifacts/PACKAGE-windows.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-smoke-evidence
          path: |
            windows-artifacts/*.txt
            windows-artifacts/windows-smoke
          if-no-files-found: warn

  android-inference:
    name: Android native inference smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/android-inference.yml
