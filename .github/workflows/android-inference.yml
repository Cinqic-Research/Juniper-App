name: android-inference

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.19.0'
  MODEL_URL: https://huggingface.co/QuantFactory/SmolLM2-135M-Instruct-GGUF/resolve/476854d00ede130660aba430d15f9347ad2e7d0e/SmolLM2-135M-Instruct.Q4_K_M.gguf
  MODEL_SHA256: 8030f04528538d47bda434f6f0bdf3952c40a58123e4d5e755332f23731a8684

jobs:
  x86_64-inference:
    name: Android x86_64 native inference smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.90.0
          targets: x86_64-linux-android
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        # The action's default also requests the removed legacy 'tools' package,
        # which now fails sdkmanager with "Failed to find package 'tools'".
        with:
          packages: platform-tools
      - name: Install Android build and emulator packages
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;29.0.13113456' 'cmake;3.31.6' 'emulator' \
            'system-images;android-30;default;x86_64'
      - run: pnpm install --frozen-lockfile
      - name: Initialize Android from a clean checkout
        run: pnpm tauri android init --ci
      - name: Generate Tauri Android Gradle wiring
        env:
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/src-tauri/gen/android
          WRY_ANDROID_PACKAGE: com.cinqic.juniper
          WRY_ANDROID_LIBRARY: juniper_lib
          WRY_ANDROID_KOTLIN_FILES_OUT_DIR: ${{ github.workspace }}/src-tauri/gen/android/app/src/main/kotlin/com/cinqic/juniper
        run: |
          mkdir -p "$WRY_ANDROID_KOTLIN_FILES_OUT_DIR"
          ndk_llvm="$ANDROID_HOME/ndk/29.0.13113456/toolchains/llvm/prebuilt/linux-x86_64/bin"
          env \
            "CC_x86_64-linux-android=$ndk_llvm/x86_64-linux-android24-clang" \
            "CXX_x86_64-linux-android=$ndk_llvm/x86_64-linux-android24-clang++" \
            "AR_x86_64-linux-android=$ndk_llvm/llvm-ar" \
            "RANLIB_x86_64-linux-android=$ndk_llvm/llvm-ranlib" \
            cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-linux-android
      - name: Build instrumentation APK and native libraries
        working-directory: src-tauri/gen/android
        run: >-
          bash ./gradlew :juniper-local-runtime:assembleDebugAndroidTest
          -PjuniperNativeAbis=x86_64 --no-daemon --stacktrace
      - name: Download and verify the pinned test model
        run: |
          mkdir -p "$RUNNER_TEMP/juniper-model"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$MODEL_URL" -o "$RUNNER_TEMP/juniper-model/SmolLM2-135M-Instruct.Q4_K_M.gguf"
          printf '%s  %s\n' "$MODEL_SHA256" \
            "$RUNNER_TEMP/juniper-model/SmolLM2-135M-Instruct.Q4_K_M.gguf" | sha256sum -c -
      - name: Create and boot clean x86_64 emulator
        run: |
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          if ! emulator -accel-check 2>&1 | grep -Fq 'installed and usable'; then
            echo 'Android emulator KVM acceleration is unavailable; refusing software emulation.' >&2
            exit 125
          fi
          echo no | avdmanager create avd --force --name juniper-inference \
            --package 'system-images;android-30;default;x86_64' --device pixel_2
          emulator -avd juniper-inference -port 5554 -no-window -no-audio \
            -no-boot-anim -no-snapshot -wipe-data -accel on \
            -gpu software > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"
          # KVM-backed hosted runners can still take several minutes to boot
          # this clean image. Wait for the emulator's own boot marker
          # before probing ADB, whose transport can lag behind boot completion.
          boot_deadline=$((SECONDS + 15 * 60))
          while (( SECONDS < boot_deadline )); do
            if grep -Fq 'Boot completed' "$RUNNER_TEMP/emulator.log" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if (( SECONDS >= boot_deadline )); then
            echo 'Android emulator did not become ready before the startup deadline.' >&2
            exit 124
          fi
          adb_deadline=$((SECONDS + 3 * 60))
          while (( SECONDS < adb_deadline )); do
            if timeout --foreground 10s adb get-state 2>/dev/null | grep -Fxq device; then
              break
            fi
            sleep 2
          done
          if (( SECONDS >= adb_deadline )); then
            echo 'Android emulator booted but ADB did not expose a device.' >&2
            exit 124
          fi
          timeout --foreground 30s adb shell input keyevent 82 || true
          timeout --foreground 30s adb shell wm dismiss-keyguard || true
          timeout --foreground 30s adb shell settings put global window_animation_scale 0 || true
          timeout --foreground 30s adb shell settings put global transition_animation_scale 0 || true
          timeout --foreground 30s adb shell settings put global animator_duration_scale 0 || true
      - name: Run native inference instrumentation smoke
        env:
          JUNIPER_TEST_MODEL_SHA256: ${{ env.MODEL_SHA256 }}
          JUNIPER_TEST_CONTEXT_SIZE: '2048'
        run: >-
          timeout --foreground 20m bash scripts/run-android-inference-smoke.sh
          "$RUNNER_TEMP/juniper-model/SmolLM2-135M-Instruct.Q4_K_M.gguf"
          src-tauri/plugins/juniper-local/android/build/outputs/apk/androidTest/debug/juniper-local-runtime-debug-androidTest.apk
          emulator-5554
      - name: Capture emulator evidence
        if: always()
        run: |
          timeout --foreground 10s adb logcat -d -t 2000 > "$RUNNER_TEMP/juniper-logcat.txt" 2>&1 || true
          timeout --foreground 10s adb shell dumpsys meminfo com.cinqic.juniper.local_runtime.test \
            > "$RUNNER_TEMP/juniper-meminfo.txt" 2>&1 || true
      - name: Upload inference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-inference-evidence
          path: |
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/juniper-logcat.txt
            ${{ runner.temp }}/juniper-meminfo.txt
          if-no-files-found: warn
      - name: Stop emulator
        if: always()
        run: |
          timeout --foreground 10s adb emu kill >/dev/null 2>&1 || true
          if [[ -f "$RUNNER_TEMP/emulator.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
          fi
